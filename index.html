<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="브라우저에서 Gemini와 자유롭게 대화하는 AI 채팅 페이지입니다. API 키는 이 브라우저에만 저장됩니다.">
<title>AI 자유 채팅</title>
<style>
:root{--bg:#10131a;--panel:#191e29;--line:#2b3344;--text:#f4f6fb;--muted:#a7b0c2;--accent:#7c9cff;--user:#243049}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2436,var(--bg) 42%);color:var(--text);font-family:"Segoe UI","Noto Sans KR",sans-serif}
button,textarea,input{font:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}header p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
button{border:1px solid var(--line);background:#222938;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#10131a;font-weight:700}
button:disabled{opacity:.55;cursor:default}
main{overflow:auto;padding:24px}
.welcome{max-width:760px;margin:8vh auto 0;text-align:center}
.welcome h2{font-size:34px;margin-bottom:8px}.welcome p{color:var(--muted);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chips button{background:#20283a}
.thread{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.message{max-width:82%;padding:13px 15px;border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{align-self:flex-end;background:var(--user)}
.message.model{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.message.error{border-color:#8d3d4b;color:#ffd5dc}
.composer{padding:14px 22px 18px}
.box{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;border:1px solid var(--line);border-radius:16px;background:#171c27}
textarea{resize:none;min-height:52px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text);padding:10px}
.note{max-width:860px;margin:8px auto 0;color:var(--muted);font-size:12px}
dialog{width:min(460px,92vw);border:1px solid var(--line);border-radius:16px;background:#171c27;color:var(--text);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.62)}
label{display:block;margin:14px 0 6px;font-weight:700}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#10141d;color:var(--text)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:640px){header{align-items:flex-start}.actions{flex-direction:column}.welcome h2{font-size:28px}.message{max-width:94%}}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<h1>AI 자유 채팅</h1>
<p id="keyStatus">API 키를 설정해 주세요.</p>
</div>
<div class="actions">
<button id="newChat" type="button">새 대화</button>
<button id="openSettings" class="primary" type="button">설정</button>
</div>
</header>
<main id="main">
<section class="welcome">
<h2>무엇이든 물어보세요</h2>
<p>글쓰기, 번역, 아이디어, 공부, 코딩 질문을 자유롭게 대화할 수 있습니다.</p>
<div class="chips">
<button type="button" data-prompt="오늘 뉴스 브리핑을 만드는 블로그 글 구성을 제안해 줘.">블로그 구성</button>
<button type="button" data-prompt="이 문장을 자연스러운 한국어로 다듬어 줘: I want to build a useful website.">문장 다듬기</button>
<button type="button" data-prompt="초보자를 위한 파이썬 공부 계획을 2주 일정으로 만들어 줘.">공부 계획</button>
</div>
</section>
</main>
<form class="composer" id="composer">
<div class="box">
<textarea id="input" rows="2" placeholder="메시지를 입력하세요. Enter로 전송하고 Shift+Enter로 줄을 바꿉니다."></textarea>
<button id="send" class="primary" type="submit">전송</button>
</div>
<p class="note">API 키는 이 브라우저에만 저장됩니다. 대화 내용은 Google Gemini로 직접 전송됩니다.</p>
</form>
</div>
<dialog id="settings">
<form method="dialog" id="settingsForm">
<h2>Gemini 설정</h2>
<p class="note">키는 GitHub에 저장되지 않습니다. Google AI Studio에서 발급한 키를 입력하세요.</p>
<label for="apiKey">API 키</label>
<input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
<p class="note">모델: Gemini 3.5 Flash-Lite. 뉴스 사이트와 같은 모델을 사용합니다.</p>
<div class="dialog-actions">
<button id="clearKey" type="button" value="clear">키 삭제</button>
<button class="primary" type="submit" value="save">저장</button>
</div>
</form>
</dialog>
<script>
const STORAGE_KEY="geminiApiKey";
const MODEL="gemini-3.5-flash-lite";
const main=document.getElementById("main");
const input=document.getElementById("input");
const sendButton=document.getElementById("send");
const settings=document.getElementById("settings");
let messages=[];
let controller=null;

function apiKey(){return localStorage.getItem(STORAGE_KEY)||""}
function modelName(){return MODEL}
function updateStatus(){
 document.getElementById("keyStatus").textContent=apiKey()?"연결됨 · "+modelName():"API 키를 설정해 주세요.";
}
function render(){
 main.replaceChildren();
 if(!messages.length){
  const welcome=document.createElement("section");
  welcome.className="welcome";
  welcome.innerHTML='<h2>무엇이든 물어보세요</h2><p>글쓰기, 번역, 아이디어, 공부, 코딩 질문을 자유롭게 대화할 수 있습니다.</p>';
  const chips=document.createElement("div");
  chips.className="chips";
  ["오늘 뉴스 브리핑을 만드는 블로그 글 구성을 제안해 줘.|블로그 구성","이 문장을 자연스러운 한국어로 다듬어 줘: I want to build a useful website.|문장 다듬기","초보자를 위한 파이썬 공부 계획을 2주 일정으로 만들어 줘.|공부 계획"].forEach(item=>{
   const [prompt,label]=item.split("|");
   const button=document.createElement("button");
   button.type="button"; button.textContent=label;
   button.addEventListener("click",()=>{input.value=prompt; input.focus()});
   chips.appendChild(button);
  });
  welcome.appendChild(chips);
  main.appendChild(welcome);
  return;
 }
 const thread=document.createElement("div");
 thread.className="thread";
 messages.forEach(message=>{
  const item=document.createElement("article");
  item.className="message "+message.role+(message.error?" error":"");
  item.textContent=message.text||(message.role==="model"?"답변을 작성하는 중...":"");
  thread.appendChild(item);
 });
 main.appendChild(thread);
 main.scrollTop=main.scrollHeight;
}
function openSettings(){
 document.getElementById("apiKey").value=apiKey();
 settings.showModal();
}
async function ask(text){
 if(!apiKey()){openSettings(); return}
 if(controller) controller.abort();
 messages.push({role:"user",text});
 const answer={role:"model",text:""};
 messages.push(answer);
 input.value="";
 sendButton.disabled=true;
 render();
 controller=new AbortController();
 const history=messages.slice(0,-1).filter(item=>item.text).map(item=>({role:item.role,parts:[{text:item.text}]}));
 try{
  const response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(modelName())+":streamGenerateContent?alt=sse&key="+encodeURIComponent(apiKey()),{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   signal:controller.signal,
   body:JSON.stringify({
    systemInstruction:{parts:[{text:"당신은 유용하고 정확한 한국어 AI 도우미입니다. 사용자가 다른 언어로 질문하면 그 언어로 답하세요. 모르는 내용은 추측하지 말고 한계를 밝히세요."}]},
    contents:history
   })
  });
  if(!response.ok){
   const error=await response.json().catch(()=>({}));
   throw new Error(error.error?.message||"요청에 실패했습니다. ("+response.status+")");
  }
  const reader=response.body.getReader();
  const decoder=new TextDecoder();
  let buffer="";
  while(true){
   const chunk=await reader.read();
   if(chunk.done) break;
   buffer+=decoder.decode(chunk.value,{stream:true});
   const lines=buffer.split("\n");
   buffer=lines.pop();
   for(const line of lines){
    if(!line.startsWith("data:")) continue;
    const data=line.slice(5).trim();
    if(!data||data==="[DONE]") continue;
    const json=JSON.parse(data);
    const part=(json.candidates?.[0]?.content?.parts||[]).filter(item=>!item.thought).map(item=>item.text||"").join("");
    if(part){answer.text+=part; render()}
   }
  }
  if(!answer.text) answer.text="답변을 받지 못했습니다. 키와 모델 설정을 확인해 주세요.";
 }catch(error){
  if(error.name!=="AbortError"){answer.error=true; answer.text=error.message}
 }
 controller=null;
 sendButton.disabled=false;
 render();
 input.focus();
}

document.getElementById("composer").addEventListener("submit",event=>{
 event.preventDefault();
 const text=input.value.trim();
 if(text) ask(text);
});
input.addEventListener("keydown",event=>{
 if(event.key==="Enter"&&!event.shiftKey){event.preventDefault(); document.getElementById("composer").requestSubmit()}
});
document.getElementById("newChat").addEventListener("click",()=>{
 if(controller) controller.abort();
 messages=[];
 render();
});
document.getElementById("openSettings").addEventListener("click",openSettings);
document.getElementById("settingsForm").addEventListener("submit",()=>{
 const key=document.getElementById("apiKey").value.trim();
 if(key) localStorage.setItem(STORAGE_KEY,key); else localStorage.removeItem(STORAGE_KEY);
 localStorage.removeItem("geminiModel");
 updateStatus();
});
document.getElementById("clearKey").addEventListener("click",()=>{
 localStorage.removeItem(STORAGE_KEY);
 document.getElementById("apiKey").value="";
 updateStatus();
});
document.querySelectorAll("[data-prompt]").forEach(button=>button.addEventListener("click",()=>{
 input.value=button.dataset.prompt; input.focus();
}));
updateStatus();
if(!apiKey()) openSettings();
</script>
</body>
</html>
